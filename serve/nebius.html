<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try FloodSense EU</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f3f6fa; --surface: #ffffff; --line: #dfe6ef; --ink: #13233a; --soft: #55657a;
    --brand: #0b5cad; --brand-ink: #083f78; --water: #3b8fd9; --water-deep: #1f6fb8;
    --ok: #1f6b41; --ok-wash: #e5f4eb; --wash: #e9f2fc; --danger: #b0202f;
    --nebius-lime: #e0ff4f; --nebius-lime-press: #cde83c; --nebius-ink: #0b1220;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0f1824; --surface: #162131; --line: #2b3a50; --ink: #e6edf6; --soft: #9fb0c4;
      --brand: #4c9be8; --brand-ink: #a9d0f7; --water: #4c9be8; --water-deep: #2f7fd0;
      --ok: #6fcf97; --ok-wash: #173226; --wash: #1a2c44; --danger: #ff8a96;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
         -webkit-font-smoothing: antialiased; padding: 2rem 1.25rem; }
  main { width: min(52rem, 100%); }
  .mark { display: flex; align-items: center; justify-content: center; gap: .5rem; font-weight: 700; color: var(--brand); margin: 0 0 1.75rem; }
  .mark svg { width: 1.4rem; height: 1.4rem; }

  .windows { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 40rem) { .windows { grid-template-columns: 1fr; } }
  .window { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 2rem 1.75rem 1.75rem;
            display: flex; flex-direction: column; align-items: flex-start; gap: .9rem; min-height: 15.5rem; }
  .window h1 { font-size: 1.35rem; letter-spacing: -.01em; margin: 0; }
  .sub { margin: 0; color: var(--soft); font-size: .95rem; }
  .window .btn { margin-top: auto; }

  .nebius { border: 2px solid var(--nebius-ink); }
  @media (prefers-color-scheme: dark) { .nebius { border-color: var(--nebius-lime); } }
  .badge { display: inline-flex; align-items: center; gap: .45rem; font-size: .8rem; font-weight: 700; padding: .3rem .7rem;
           border-radius: 8px; background: var(--nebius-ink); color: var(--nebius-lime); }
  .badge::before { content: ""; width: .5rem; height: .5rem; border-radius: 2px; background: var(--nebius-lime); }
  .pill { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 600; padding: .3rem .7rem;
          border-radius: 999px; background: var(--wash); color: var(--brand-ink); }
  .pill::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--ok-wash); color: var(--ok); }
  .head { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }

  /* The VM's state as a water level. */
  .level { width: 100%; height: .6rem; border-radius: 999px; background: var(--wash); overflow: hidden; }
  .level span { display: block; height: 100%; width: 0%; border-radius: inherit;
                background: linear-gradient(to right, var(--water-deep), var(--water)); transition: width 1.2s ease-in-out; }
  @media (prefers-reduced-motion: reduce) { .level span { transition: none; } }

  .btn { font: inherit; font-size: 1rem; font-weight: 600; border-radius: 999px; padding: .75rem 1.5rem; cursor: pointer;
         text-decoration: none; border: 1.5px solid transparent; display: inline-flex; align-items: center; justify-content: center; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-ink); }
  .btn.nb { background: var(--nebius-lime); color: var(--nebius-ink); }
  .btn.nb:hover:not(:disabled) { background: var(--nebius-lime-press); border-color: var(--nebius-ink); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
  .err { margin: 0; font-size: .85rem; color: var(--danger); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M12 3v7"/><path d="M9 7l3 3 3-3"/></svg>
    FloodSense EU
  </p>
  <div class="windows">
    <section class="window" aria-labelledby="own-title">
      <h1 id="own-title">Private server</h1>
      <p class="sub">Opens instantly</p>
      <a class="btn primary" href="/">Open demo</a>
    </section>

    <section class="window nebius" aria-labelledby="nb-title">
      <div class="head"><span class="badge">Nebius AI Cloud</span><span id="pill" class="pill" role="status" aria-live="polite">Checking</span></div>
      <h1 id="nb-title">Nebius Cloud</h1>
      <p id="sub" class="sub">Wakes in about a minute</p>
      <div class="level" aria-hidden="true"><span id="level"></span></div>
      <button id="start" class="btn nb hidden" type="button">Start on Nebius</button>
      <a id="open" class="btn nb hidden" href="#" target="_blank" rel="noopener">Open on Nebius</a>
      <p id="err" class="err" role="alert"></p>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const at = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  let timer = null;

  function show(s) {
    const busy = ["STARTING", "STOPPING"].includes(s.state) || (s.state === "RUNNING" && !s.ready);
    const label = !s.configured ? "Offline" : s.ready ? "Ready" : s.state === "STOPPED" ? "Asleep"
      : s.state === "STARTING" ? "Waking" : s.state === "RUNNING" ? "Starting app" : s.state === "STOPPING" ? "Going to sleep" : "Unavailable";
    const level = s.ready ? 100 : s.state === "RUNNING" ? 72 : s.state === "STARTING" ? 38 : 6;
    $("pill").textContent = label;
    $("pill").className = "pill" + (s.ready ? " ok" : "");
    $("level").style.width = level + "%";
    $("sub").textContent = s.ready ? (s.stops_at ? `Sleeps at ${at(s.stops_at)}` : "Running") : busy ? "Getting ready" : "Wakes in about a minute";
    $("start").classList.toggle("hidden", !(s.configured && ["STOPPED", "ERROR"].includes(s.state)));
    $("open").classList.toggle("hidden", !s.ready);
    if (s.demo_url) $("open").href = s.demo_url;
    clearTimeout(timer);
    timer = setTimeout(refresh, busy ? 4000 : 30000);
  }

  async function refresh() {
    try {
      const r = await fetch("/nebius/api/status", { cache: "no-store" });
      show(await r.json());
      $("err").textContent = "";
    } catch { $("err").textContent = "Status unavailable right now."; timer = setTimeout(refresh, 10000); }
  }

  $("start").onclick = async (e) => {
    const b = e.currentTarget; b.disabled = true; $("err").textContent = "";
    try {
      const r = await fetch("/nebius/api/start", { method: "POST" });
      if (!r.ok) $("err").textContent = "Could not start it. Try again in a moment.";
    } catch { $("err").textContent = "Could not start it. Try again in a moment."; }
    b.disabled = false; refresh();
  };
  refresh();
</script>
</body>
</html>
